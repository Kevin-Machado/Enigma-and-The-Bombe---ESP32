; Enigma + The Bombe — ESP32 (Arduino Framework)
; Maqueta educativa para exposicion de Historia, 18 noviembre 2026

[platformio]
default_envs = esp32dev
src_dir = src
data_dir = data

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv
board_build.f_cpu = 240000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_deps =

[env:native]
platform = native
build_flags =
    -DHOST_BUILD
    -std=c++17
    -Wall
    -Wextra
    -O2
    -I src
test_build_src = true
